<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="40%" stop-color="#bfdbfe" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="sunGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#fef08a" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="mountainGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="mountainGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>

  <!-- Sky Base -->
  <rect width="1600" height="900" fill="url(#skyGrad)" />

  <!-- Sun Rays & Glow -->
  <circle cx="800" cy="300" r="450" fill="url(#sunGlow)" />
  <circle cx="450" cy="220" r="180" fill="#ffffff" fill-opacity="0.4" filter="blur(20px)" />
  <circle cx="1150" cy="260" r="220" fill="#ffffff" fill-opacity="0.3" filter="blur(30px)" />

  <!-- Distant Clouds & Highlights -->
  <ellipse cx="400" cy="180" rx="320" ry="80" fill="#ffffff" fill-opacity="0.75" />
  <ellipse cx="1200" cy="200" rx="360" ry="90" fill="#ffffff" fill-opacity="0.8" />
  <ellipse cx="800" cy="240" rx="280" ry="60" fill="#ffffff" fill-opacity="0.6" />

  <!-- Mountain Silhouette Range 1 (Distant) -->
  <polygon points="-50,900 120,540 380,680 620,490 890,620 1140,460 1420,640 1650,510 1650,900" fill="url(#mountainGrad2)" />

  <!-- Mountain Silhouette Range 2 (Foreground) -->
  <polygon points="-50,900 180,630 420,740 720,580 960,710 1280,560 1520,690 1650,600 1650,900" fill="url(#mountainGrad1)" />

  <!-- Light Texture Overlay simulating real high-res photography -->
  <rect width="1600" height="900" fill="#cbd5e1" fill-opacity="0.12" />
</svg>
